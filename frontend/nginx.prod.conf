# KEMTA SUIVI — Nginx de production (phase 11).
#
# Rôle : terminaison TLS, redirection HTTP → HTTPS, en-têtes de sécurité, compression, cache des
# assets, limitation de débit en bordure, proxy de l'API et service des médias protégés.
# Les certificats sont montés dans /etc/nginx/certs (fullchain.pem, privkey.pem) : ils ne sont
# jamais dans l'image ni dans le dépôt.

# Limitation de débit en bordure (en plus des limites applicatives de l'API).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name _;
    # La sonde de santé interne reste en HTTP ; tout le reste passe en HTTPS.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    limit_conn perip 40;

    # En-têtes de sécurité (l'API pose les siens ; ceux-ci couvrent la SPA statique).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 12m;

    # SPA : toute route inconnue retombe sur index.html (jamais mise en cache : nouvelle version).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Assets fingerprintés par Vite : cache long, immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Authentification : débit très bas en bordure (l'API applique ses propres quotas OTP/login).
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/proxy_api.conf;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/proxy_api.conf;
    }

    # Métriques et état d'exploitation : jamais exposés à Internet. Le scraper Prometheus
    # interroge `web:8000/api/ops/metrics/` directement dans le réseau Docker (jeton METRICS_TOKEN) ;
    # le port de `web` n'est pas publié en production.
    location /api/ops/ {
        return 404;
    }

    # Médias : uniquement via l'API (contrôle d'accès par projet). Django répond
    # `X-Accel-Redirect: /protected-media/...` et Nginx envoie alors le fichier ; l'emplacement est
    # `internal` : impossible de l'appeler directement depuis le navigateur.
    location /protected-media/ {
        internal;
        alias /var/media/;
        add_header Cache-Control "private, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pas de /media/ public : toute tentative est refusée.
    location /media/ {
        return 404;
    }

    # Le back-office Django (statique uniquement) est servi depuis le volume partagé.
    location /static/ {
        alias /var/static/;
        expires 30d;
        add_header Cache-Control "public" always;
    }
}
