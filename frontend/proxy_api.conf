# Directives communes du proxy vers l'API Django (incluses par nginx.prod.conf).
proxy_pass http://web:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# `$remote_addr` (et non `$proxy_add_x_forwarded_for`) : on écrase toute valeur fournie par le
# client. Django ne fait confiance qu'à NUM_PROXIES=1 saut, donc à cette adresse.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
