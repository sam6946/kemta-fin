name: kemta-suivi

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kemta}
      POSTGRES_USER: ${POSTGRES_USER:-kemta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kemta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kemta} -d ${POSTGRES_DB:-kemta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-true}
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-kemta}:${POSTGRES_PASSWORD:-kemta}@db:5432/${POSTGRES_DB:-kemta}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - ./backend:/app
      - media:/app/var/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-true}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kemta}:${POSTGRES_PASSWORD:-kemta}@db:5432/${POSTGRES_DB:-kemta}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A config worker -l info --concurrency 2
    volumes:
      - ./backend:/app
      - media:/app/var/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-true}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kemta}:${POSTGRES_PASSWORD:-kemta}@db:5432/${POSTGRES_DB:-kemta}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_TARGET: http://web:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  media:
